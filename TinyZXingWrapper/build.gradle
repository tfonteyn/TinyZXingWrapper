import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias libs.plugins.android.library
}

/*
    $HOME/.gradle/gradle.properties:
        TinyZXingWrapper.properties=$HOME/blah/blah/TinyZXingWrapper.properties

    $HOME/blah/blah/TinyZXingWrapper.properties:
        sign.storeFile=$HOME/blah/blah/keystore.jks
        sign.storePassword=MyStorePassword
        sign.keyAlias=MyKeyAlias
        sign.keyPassword=MyKeyPassword
 */
final def props = new Properties()
if (project.hasProperty("TinyZXingWrapper.properties")) {
    final def file = new File(project.property("TinyZXingWrapper.properties"))
    if (file.exists()) {
        props.load(new FileInputStream(file))
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.toolchain.get())
    }
}

/* https://kotlinlang.org/docs/gradle.html */
kotlin {
    jvmToolchain {
        languageVersion.set(JavaLanguageVersion.of(libs.versions.java.toolchain.get()))
    }
    compilerOptions {
        jvmTarget = JvmTarget.JVM_11
    }
}

ext {
    tinyZXingWrapperVersion = rootProject.ext.versionName
}

base {
    archivesName = "${project.name}-${rootProject.ext.versionName}"
}

android {
    namespace = "com.hardbacknutter.tinyzxingwrapper"
    compileSdk = libs.versions.compileSdk.get().toInteger()

    resourcePrefix = "tzw_"

    signingConfigs {
        release {
            storeFile = file(props["sign.storeFile"])
            storePassword = props["sign.storePassword"]
            keyAlias = props["sign.keyAlias"]
            keyPassword = props["sign.keyPassword"]
        }
    }

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()

        signingConfig = signingConfigs.release

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles("consumer-rules.pro")
    }

    buildTypes {
        debug {

        }
        release {
            minifyEnabled = false
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro")
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11

        coreLibraryDesugaringEnabled = true
    }

    testOptions {
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    lint {
        // allow command line builds to complete
        abortOnError = false
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }
}

dependencies {
    api(libs.zxing.core)

    coreLibraryDesugaring(libs.google.desugar)

    implementation(libs.androidx.activity)
    implementation(libs.androidx.fragment)
    implementation(libs.androidx.lifecycle.livedata)
    implementation(libs.androidx.lifecycle.viewmodel)

    implementation(libs.androidx.camera.camera2)
    implementation(libs.androidx.camera.core)
    implementation(libs.androidx.camera.lifecycle)
    implementation(libs.androidx.camera.view)
    implementation(libs.androidx.camera.extensions)

    implementation(libs.google.material)
}

final def javadocTask = tasks.register("javadocGenerate", Javadoc) {
    description = "Generates Javadoc for the TinyZXingWrapper library"
    group = "documentation"
    source = android.sourceSets.main.java.srcDirs

    // Use the legacy 'destinationDir' property
    destinationDir = layout.buildDirectory.dir("outputs/javadoc").get().asFile

    options {
        setMemberLevel(JavadocMemberLevel.PUBLIC)
        links("https://developer.android.com/reference/")
        encoding = "UTF-8"
        addStringOption('Xdoclint:none', '-quiet')
    }
    failOnError = false
}

tasks.register('javadocJar', Jar) {
    description = "Creates a Javadoc Jar for the TinyZXingWrapper library." +
            "The result can be found in 'build/outputs/docs/"
    group = "documentation"
    dependsOn javadocTask

    // Bridge the File to a Provider for the Jar task
    from javadocTask.map { it.destinationDir }

    // create a subfolder in the jar for all the html files
    into("docs")
    // Where to store the jar file
    destinationDirectory = project.layout.buildDirectory.dir("outputs/docs")
    archiveFileName = "${project.name}-javadocs-${tinyZXingWrapperVersion}.jar"
}

androidComponents {
    onVariants(selector().withBuildType("release")) { final variant ->
        javadocTask.configure {
            // Get the SDK provider inside the variant block
            final def sdkFiles = androidComponents.sdkComponents.bootClasspath

            // Reconstruct the classpath
            classpath = project.files(sdkFiles)
            classpath += variant.compileConfiguration.incoming.artifactView {}.files
        }
    }
}

// Whenever a release build is done, trigger the Javadoc task.
tasks.configureEach { final task ->
    if (task.name == "assembleRelease") {
        task.finalizedBy(javadocJar)
    }
}